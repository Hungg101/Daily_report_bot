services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: daily_report_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD_must_be_set}
      APP_DATABASE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD_must_be_set}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daily_report_bot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init/00-create-runtime-role.sh:/docker-entrypoint-initdb.d/00-create-runtime-role.sh:ro

  app:
    image: daily-report-telegram-bot:local
    restart: unless-stopped
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_MINI_APP_URL: ${TELEGRAM_BOT_MINI_APP_URL:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/daily_report_bot
      SPRING_DATASOURCE_USERNAME: daily_report_app
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD_must_be_set}
      APP_REPORT_TIME_ZONE: ${APP_REPORT_TIME_ZONE:-Asia/Ho_Chi_Minh}
      APP_REMINDER_ENABLED: ${APP_REMINDER_ENABLED:-false}
      APP_REMINDER_DEPARTMENT: ${APP_REMINDER_DEPARTMENT:-}
      APP_REMINDER_UNIT: ${APP_REMINDER_UNIT:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    restart: unless-stopped
    profiles:
      - miniapp
    command: tunnel --no-autoupdate run --token-file /run/secrets/cloudflare-tunnel-token
    secrets:
      - cloudflare-tunnel-token

volumes:
  postgres-data:

secrets:
  cloudflare-tunnel-token:
    file: ./secrets/cloudflare-tunnel-token.txt
